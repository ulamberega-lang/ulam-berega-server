name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: בדיקת תחביר לכל קבצי ה-JavaScript
        run: find server.js src public dev test -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: בדיקות
        run: npm test

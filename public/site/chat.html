<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שמחה בשיחה - צ'אט</title>
<meta name="description" content="צ'אט שמחה בשיחה: מוצאים אולם לאירוע לפי כמות מוזמנים, עיר ושכונה, או לפי שם.">
<style>
  :root { --green: #008069; --bg: #efeae2; --out: #d9fdd3; --in: #fff; --text: #111b21; --muted: #667781; --link: #027eb5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #d1d7db; color: var(--text); display: flex; justify-content: center; }
  .app { width: 100%; max-width: 760px; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); position: relative; box-shadow: 0 0 20px rgba(0,0,0,.15); }
  header { background: var(--green); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
  .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; font: inherit; text-align: start; cursor: pointer; padding: 0; }
  .title { flex: 1; min-width: 0; display: block; }
  .title b { display: block; font-size: 1.05rem; }
  .title span { font-size: .8rem; opacity: .85; }
  header button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 18px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 6px; background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 18px 18px; }
  .row { display: flex; flex-direction: column; max-width: 86%; }
  .row.in { align-self: flex-start; }
  .row.out { align-self: flex-end; }
  .bubble { background: var(--in); border-radius: 10px; padding: 7px 10px 6px; box-shadow: 0 1px 1px rgba(0,0,0,.12); white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.45; font-size: .98rem; }
  .row.out .bubble { background: var(--out); }
  .nb { white-space: nowrap; }
  .bubble a { color: var(--link); }
  .bubble .quote { display: block; border-inline-start: 3px solid #c3c9cd; padding-inline-start: 8px; color: var(--muted); font-size: .9rem; }
  .time { font-size: .7rem; color: var(--muted); text-align: end; margin-top: 2px; display: block; }
  .btns { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .btns button { background: var(--in); color: var(--link); border: 0; border-radius: 10px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .btns button:hover { background: #f5f6f6; }
  .btns button:disabled { color: var(--muted); cursor: default; }
  .typing .bubble { color: var(--muted); letter-spacing: 3px; }
  form { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #f0f2f5; }
  input { flex: 1; min-width: 0; border: 0; border-radius: 22px; padding: 11px 16px; font: inherit; font-size: 1rem; background: #fff; outline: none; }
  form button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--green); color: #fff; font-size: 1.2rem; cursor: pointer; flex: none; }
  .info { position: absolute; inset: 0; background: #f0f2f5; display: none; flex-direction: column; overflow-y: auto; z-index: 5; }
  .info.open { display: flex; }
  .info header { position: sticky; top: 0; }
  .info header button { background: none; font-size: 1.5rem; padding: 0 6px; }
  .card { background: #fff; margin-bottom: 10px; padding: 14px 18px; }
  .card.top { text-align: center; padding: 24px 18px; }
  .card.top img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; }
  .card.top h2 { margin: 12px 0 2px; font-size: 1.4rem; }
  .card.top p { margin: 0; color: var(--muted); }
  .card h4 { margin: 0 0 6px; font-size: .85rem; color: var(--muted); font-weight: 500; }
  .card p { margin: 0; line-height: 1.5; }
  .links a { display: flex; align-items: center; gap: 12px; padding: 12px 0; color: var(--text); text-decoration: none; border-top: 1px solid #f0f2f5; }
  .links a:first-child { border-top: 0; }
  .links a span { font-size: 1.3rem; width: 28px; text-align: center; }
  .links a small { display: block; color: var(--muted); }
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; }
  .sheet-bg.open { display: flex; }
  .sheet { background: #fff; width: 100%; max-height: 75%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; }
  .sheet h3 { margin: 0; padding: 16px; font-size: 1rem; border-bottom: 1px solid #e9edef; display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
  .sheet ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  .sheet li { padding: 14px 16px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
  .sheet li:hover { background: #f5f6f6; }
  .sheet li small { display: block; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="who" id="who" type="button" aria-label="פרטי העסק">
      <img class="avatar" src="/logo.png" alt="">
      <span class="title"><b>שמחה בשיחה</b><span>כל האולמות במספר אחד · לחצו לפרטים</span></span>
    </button>
    <button id="menuBtn" type="button">תפריט</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="text" placeholder="כתבו הודעה" enterkeyhint="send" aria-label="הודעה">
    <button type="submit" aria-label="שליחה">➤</button>
  </form>
  <div class="info" id="info" role="dialog" aria-label="פרטי העסק">
    <header><button id="infoClose" type="button" aria-label="חזרה">→</button><div class="title"><b>פרטי העסק</b></div></header>
    <div class="card top"><img src="/logo.png" alt="שמחה בשיחה"><h2>שמחה בשיחה</h2><p>כל האולמות במספר אחד</p></div>
    <div class="card"><h4>אודות</h4><p>מוצאים אולם לאירוע לפי כמות מוזמנים, עיר ושכונה, או לפי שם, ומתחברים ישירות לטלפון של האולם.</p></div>
    <div class="card links">
      <a href="tel:033130858"><span>📞</span><div>03-313-0858</div></a>
      <a href="https://wa.me/97233130858" target="_blank" rel="noopener"><span>💬</span><div>WhatsApp</div></a>
      <a href="mailto:Simchabesicha@gmail.com"><span>✉️</span><div>Simchabesicha@gmail.com</div></a>
      <a href="/" target="_blank" rel="noopener"><span>🌐</span><div>דף הבית</div></a>
      <a href="/privacy" target="_blank" rel="noopener"><span>🔒</span><div>מדיניות פרטיות</div></a>
    </div>
  </div>
  <div class="sheet-bg" id="sheetBg"><div class="sheet"><h3><span id="sheetTitle"></span><button id="sheetClose" type="button" aria-label="סגירה">×</button></h3><ul id="sheetRows"></ul></div></div>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('text');
const sheetBg = document.getElementById('sheetBg');
let busy = false;

// מזהה שיחה: נשמר בלשונית (רענון לא מאפס), ואם האחסון חסום - מזהה לרענון הנוכחי
function makeSid() {
  try { const s = sessionStorage.getItem('sid'); if (s) return s; } catch {}
  const s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/[^A-Za-z0-9_-]/g, '').padEnd(16, 'x');
  try { sessionStorage.setItem('sid', s); } catch {}
  return s;
}
const sid = makeSid();
// קישורי חיוג (tel:) עובדים רק בטלפון: השרת לא יציג אותם במחשב
const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// עיצוב וואטסאפ: *מודגש*, קישורים, מספר טלפון לחיץ, ושורה שמתחילה ב-"> " כציטוט
function fmt(text) {
  return text.split('\n').map((line) => {
    const quote = line.startsWith('> ');
    let h = esc(quote ? line.slice(2) : line);
    h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/(^|[\s(,:])(0\d{1,2}-\d{3}-\d{4})(?=[\s,.)]|$)/g, (m, p, n) => `${p}<a href="tel:${n.replace(/-/g, '')}">${n}</a>`);
    h = h.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    h = h.replace(/\u2066[^\u2069]*\u2069/g, '<span class="nb">$&</span>'); // מספר החיוג לא נשבר לשתי שורות
    return quote ? `<span class="quote">${h}</span>` : h;
  }).join('\n').replace(/<\/span>\n(?=<span class="quote">)/g, '</span>');
}
const hhmm = () => new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
const scroll = () => { log.scrollTop = log.scrollHeight; };

function bubble(kind, html) {
  const row = document.createElement('div');
  row.className = `row ${kind}`;
  row.innerHTML = `<div class="bubble" dir="auto">${html}<span class="time">${hhmm()}</span></div>`;
  log.appendChild(row);
  scroll();
  return row;
}

function openSheet(title, rows) {
  document.getElementById('sheetTitle').textContent = title;
  const ul = document.getElementById('sheetRows');
  ul.innerHTML = '';
  for (const [id, t, desc] of rows) {
    const li = document.createElement('li');
    li.innerHTML = `${esc(t)}${desc ? `<small>${esc(desc)}</small>` : ''}`;
    li.onclick = () => { sheetBg.classList.remove('open'); choose(id, t); };
    ul.appendChild(li);
  }
  sheetBg.classList.add('open');
}
document.getElementById('sheetClose').onclick = () => sheetBg.classList.remove('open');
sheetBg.onclick = (e) => { if (e.target === sheetBg) sheetBg.classList.remove('open'); };

function render(m) {
  if (m.kind === 'text') return bubble('in', fmt(m.text));
  const row = bubble('in', fmt(m.body));
  const box = document.createElement('div');
  box.className = 'btns';
  if (m.kind === 'buttons') {
    for (const [id, title] of m.buttons) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = title;
      b.onclick = () => choose(id, title);
      box.appendChild(b);
    }
  } else {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = `☰ ${m.button}`;
    b.onclick = () => openSheet(m.button, m.rows);
    box.appendChild(b);
  }
  row.appendChild(box);
  scroll();
}

// כפתורים ישנים נחסמים אחרי לחיצה: כך לא לוחצים על שלב שכבר עבר (נשארת רק הרשימה האחרונה פעילה)
function lockOld() { for (const b of log.querySelectorAll('.btns button')) b.disabled = true; }

async function send(payload) {
  if (busy) return;
  busy = true;
  const wait = bubble('in typing', '•••');
  wait.classList.add('typing');
  try {
    const res = await fetch('/api/webchat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sid, desktop: !mobile, ...payload }) });
    if (!res.ok) throw new Error(res.status);
    const { messages } = await res.json();
    wait.remove();
    for (const m of messages) { render(m); await new Promise((r) => setTimeout(r, 250)); }
  } catch {
    wait.remove();
    bubble('in', 'הייתה תקלה. נסו שוב בעוד רגע 🙏');
  } finally { busy = false; }
}

function choose(id, title) { lockOld(); bubble('out', esc(title)); send({ id }); }
document.getElementById('form').onsubmit = (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  lockOld(); bubble('out', esc(t)); send({ text: t });
};
const info = document.getElementById('info');
document.getElementById('who').onclick = () => info.classList.add('open');
document.getElementById('infoClose').onclick = () => info.classList.remove('open');
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { info.classList.remove('open'); sheetBg.classList.remove('open'); } });
document.getElementById('menuBtn').onclick = () => choose('m:menu', 'תפריט ראשי');

send({}); // פתיחת שיחה: ברכה ותפריט
</script>
</body>
</html>

<style>
  /* הצבעים והגופנים מ-site.css: כחול לילה, ירוק בקבוק ויין, זהב כצבע הדגשה יחיד */
  :root { --in: var(--navy-2); --out: var(--green-2); }
  html, body { height: 100%; margin: 0; }
  body { background: linear-gradient(160deg, #0c1220 0%, #161a2e 50%, #2a0f1d 100%) fixed; min-height: 0; display: flex; justify-content: center; padding: 24px 14px; }
  header :focus-visible { outline-color: var(--gold); }
  .app { width: 100%; max-width: 640px; height: calc(100dvh - 48px); overflow: hidden; border-radius: var(--r); display: flex; flex-direction: column; background: var(--navy); position: relative; border: 1px solid var(--line-strong); }
  header { background: linear-gradient(160deg, var(--navy-2), var(--wine-2)); color: var(--text); padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
  .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; font: inherit; text-align: start; cursor: pointer; padding: 0; }
  .title { flex: 1; min-width: 0; display: block; }
  .title b { display: block; font-family: var(--serif); font-size: 1.15rem; font-weight: 700; }
  .title .hint { font-style: normal; }
  .title span { display: block; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button:not(.who) { background: transparent; color: var(--text); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; transition: border-color .2s ease-out, color .2s ease-out; }
  header button:not(.who):hover { border-color: var(--gold); color: var(--gold); }
  #log { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; flex-direction: column; max-width: 86%; }
  .row.in { align-self: flex-start; }
  .row.out { align-self: flex-end; }
  .bubble { background: var(--in); color: var(--text); border-radius: var(--r); padding: 10px 14px 8px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.5; font-size: .98rem; }
  .row.out .bubble { background: var(--out); }
  .nb { white-space: nowrap; }
  .bubble a { color: var(--gold); background-size: 100% 1px; }
  .bubble .quote { display: block; border-inline-start: 2px solid var(--gold); padding-inline-start: 8px; color: var(--muted); font-size: .9rem; }
  .time { font-family: var(--mono); font-size: .66rem; color: var(--muted); text-align: end; margin-top: 2px; display: block; }
  .btns { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .btns button { background: transparent; color: var(--gold); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 11px 14px; font: inherit; font-weight: 500; cursor: pointer; transition: border-color .2s ease-out, background-color .2s ease-out; }
  .btns button:hover { border-color: var(--gold); background: var(--surface); }
  .btns button:disabled { color: var(--muted); cursor: default; border-color: var(--line); background: transparent; }
  .typing .bubble { color: var(--muted); letter-spacing: 3px; }
  form { display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; border: 1px solid var(--line-strong); border-radius: var(--r); height: 48px; padding: 0 16px; font: inherit; font-size: 1rem; background: var(--bg); color: var(--text); outline: none; transition: border-color .2s ease-out; }
  input:focus { border-color: var(--gold); }
  input:focus-visible { outline: none; } /* המסגרת הזהובה מסמנת את השדה הפעיל */
  input::placeholder { color: var(--muted); }
  form button { width: 48px; height: 48px; border: 0; border-radius: var(--r); background: var(--gold); color: var(--on-gold); font-size: 1.2rem; cursor: pointer; flex: none; transition: background-color .2s ease-out; }
  form button:hover { background: var(--gold-hover); }
  .info { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; overflow-y: auto; z-index: 5; }
  .info.open { display: flex; }
  .info header { position: sticky; top: 0; }
  .info header button { background: none; border: 0 !important; font-size: 1.5rem; padding: 0 6px; }
  .card { border-bottom: 1px solid var(--line); padding: 18px 20px; }
  .card.top { text-align: center; padding: 32px 20px 28px; }
  .card.top img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
  .card.top h2 { margin: 14px 0 2px; font-family: var(--serif); font-size: 1.6rem; }
  .card.top p { margin: 0; color: var(--muted); }
  .card h4 { margin: 0 0 6px; font-size: .85rem; color: var(--muted); font-weight: 400; }
  .card p { margin: 0; line-height: 1.55; }
  .links a { display: flex; align-items: center; gap: 12px; padding: 12px 0; color: var(--text); background: none; border-top: 1px solid var(--line); }
  .links a:first-child { border-top: 0; }
  .links a:hover { color: var(--gold); }
  .links a span { font-size: 1.3rem; width: 28px; text-align: center; }
  .links a small { display: block; color: var(--muted); }
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  .sheet-bg.open { display: flex; }
  .sheet { background: var(--surface); border: 1px solid var(--line-strong); width: 100%; max-height: 75%; border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
  .sheet h3 { margin: 0; padding: 16px; font-size: 1.05rem; border-bottom: 1px solid var(--line); font-family: var(--serif); display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
  .sheet ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  .sheet li { border-bottom: 1px solid var(--line); }
  .sheet li button { width: 100%; text-align: start; background: none; border: 0; padding: 14px 16px; font: inherit; color: var(--text); cursor: pointer; transition: background-color .15s ease-out; }
  .sheet li button:hover { background: var(--surface-2); }
  .sheet li small { display: block; color: var(--muted); }
  @media (max-width: 600px) { .title .hint { display: none; } body { padding: 0; } .app { height: 100dvh; border: 0; border-radius: 0; } }
</style>

<body>
<div class="app">
  <header>
    <button class="who" id="who" type="button" aria-label="פרטי העסק">
      <img class="avatar" src="/logo.png" alt="">
      <span class="title"><b>שמחה בשיחה</b><span>כל האולמות במספר אחד<em class="hint"> · לחצו לפרטים</em></span></span>
    </button>
    <button id="menuBtn" type="button">תפריט</button>
  </header>
  <div id="log" role="log" aria-live="polite" aria-label="שיחה" tabindex="0"></div>
  <form id="form" autocomplete="off">
    <input id="text" placeholder="כתבו הודעה" enterkeyhint="send" aria-label="הודעה">
    <button type="submit" aria-label="שליחה"><span aria-hidden="true">➤</span></button>
  </form>
  <div class="info" id="info" role="dialog" aria-modal="true" aria-label="פרטי העסק">
    <header><button id="infoClose" type="button" aria-label="חזרה">→</button><div class="title"><b>פרטי העסק</b></div></header>
    <div class="card top"><img src="/logo.png" alt="שמחה בשיחה"><h2>שמחה בשיחה</h2><p>כל האולמות במספר אחד</p></div>
    <div class="card"><h4>אודות</h4><p>מוצאים אולם לאירוע לפי כמות מוזמנים, עיר ושכונה, או לפי שם, ומתחברים ישירות לטלפון של האולם.</p></div>
    <div class="card links">
      <a href="tel:033130858"><span aria-hidden="true">📞</span><div>03-313-0858</div></a>
      <a href="https://wa.me/97233130858" target="_blank" rel="noopener"><span aria-hidden="true">💬</span><div>WhatsApp</div></a>
      <a href="mailto:info@simcha-besicha.co.il"><span aria-hidden="true">✉️</span><div>info@simcha-besicha.co.il</div></a>
      <a href="/" target="_blank" rel="noopener"><span aria-hidden="true">🌐</span><div>דף הבית</div></a>
      <a href="/privacy" target="_blank" rel="noopener"><span aria-hidden="true">🔒</span><div>מדיניות פרטיות</div></a>
      <a href="/accessibility" target="_blank" rel="noopener"><span aria-hidden="true">♿</span><div>הצהרת נגישות</div></a>
    </div>
  </div>
  <div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h3><span id="sheetTitle"></span><button id="sheetClose" type="button" aria-label="סגירה">×</button></h3><ul id="sheetRows"></ul></div></div>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('text');
const sheetBg = document.getElementById('sheetBg');
let busy = false;

// מזהה שיחה: נשמר בלשונית (רענון לא מאפס), ואם האחסון חסום - מזהה לרענון הנוכחי
function makeSid() {
  try { const s = sessionStorage.getItem('sid'); if (s) return s; } catch {}
  const s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/[^A-Za-z0-9_-]/g, '').padEnd(16, 'x');
  try { sessionStorage.setItem('sid', s); } catch {}
  return s;
}
const sid = makeSid();
// מזהה הדפדפן לסטטיסטיקה (אותו מזהה של assets/visit.js): משתמש בצ'אט נספר פעם אחת גם אם פתח כמה לשוניות
function visitorKey() {
  try {
    let v = localStorage.getItem('ub-v');
    if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : `${Math.random()}${Date.now()}`).replace(/[^A-Za-z0-9]/g, '').slice(0, 32); localStorage.setItem('ub-v', v); }
    return v;
  } catch { return undefined; }
}
const visitor = visitorKey();
// קישורי חיוג (tel:) עובדים רק בטלפון: השרת לא יציג אותם במחשב
const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// עיצוב וואטסאפ: *מודגש*, קישורים, מספר טלפון לחיץ, ושורה שמתחילה ב-"> " כציטוט
function fmt(text) {
  return text.split('\n').map((line) => {
    const quote = line.startsWith('> ');
    let h = esc(quote ? line.slice(2) : line);
    // קישורים עם https:// וגם בלי (הבוט מציג כתובות בלי https://): חייבים נקודה בדומיין ונתיב אחרי /
    h = h.replace(/(^|[\s\u200F(])((?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}\/[^\s<]*)/gi, (m, pre, url) =>
      `${pre}<a href="${/^https?:/i.test(url) ? url : 'https://' + url}" target="_blank" rel="noopener">${url}</a>`);
    h = h.replace(/(^|[\s(,:])(0\d{1,2}-\d{3}-\d{4})(?=[\s,.)]|$)/g, (m, p, n) => `${p}<a href="tel:${n.replace(/-/g, '')}">${n}</a>`);
    h = h.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    h = h.replace(/\u2066[^\u2069]*\u2069/g, '<span class="nb">$&</span>'); // מספר החיוג לא נשבר לשתי שורות
    return quote ? `<span class="quote">${h}</span>` : h;
  }).join('\n').replace(/<\/span>\n(?=<span class="quote">)/g, '</span>');
}
const hhmm = () => new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
const scroll = () => { log.scrollTop = log.scrollHeight; };

function bubble(kind, html) {
  const row = document.createElement('div');
  row.className = `row ${kind}`;
  row.innerHTML = `<div class="bubble" dir="auto">${html}<span class="time">${hhmm()}</span></div>`;
  log.appendChild(row);
  scroll();
  return row;
}

function openSheet(title, rows) {
  document.getElementById('sheetTitle').textContent = title;
  const ul = document.getElementById('sheetRows');
  ul.innerHTML = '';
  for (const [id, t, desc] of rows) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `${esc(t)}${desc ? `<small>${esc(desc)}</small>` : ''}`;
    b.onclick = () => { closeSheet(false); choose(id, t); };
    li.appendChild(b);
    ul.appendChild(li);
  }
  opener = document.activeElement;
  sheetBg.classList.add('open');
  ul.querySelector('button')?.focus();
}
// סגירת החלון: המיקוד חוזר למה שפתח אותו
let opener = null;
function closeSheet(restore = true) {
  sheetBg.classList.remove('open');
  if (restore && opener) opener.focus();
}
document.getElementById('sheetClose').onclick = () => closeSheet();
sheetBg.onclick = (e) => { if (e.target === sheetBg) closeSheet(); };

function render(m) {
  if (m.kind === 'text') return bubble('in', fmt(m.text));
  const row = bubble('in', fmt(m.body));
  const box = document.createElement('div');
  box.className = 'btns';
  if (m.kind === 'buttons') {
    for (const [id, title] of m.buttons) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = title;
      b.onclick = () => choose(id, title);
      box.appendChild(b);
    }
  } else {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = `☰ ${m.button}`;
    b.onclick = () => openSheet(m.button, m.rows);
    box.appendChild(b);
  }
  row.appendChild(box);
  scroll();
}

// כפתורים ישנים נחסמים אחרי לחיצה: כך לא לוחצים על שלב שכבר עבר (נשארת רק הרשימה האחרונה פעילה)
function lockOld() { for (const b of log.querySelectorAll('.btns button')) b.disabled = true; }

async function send(payload) {
  if (busy) return;
  busy = true;
  const wait = bubble('in typing', '•••');
  wait.classList.add('typing');
  try {
    const res = await fetch('/api/webchat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sid, v: visitor, desktop: !mobile, ...payload }) });
    if (!res.ok) throw new Error(res.status);
    const { messages } = await res.json();
    wait.remove();
    // הפסקה קצרה בין הודעות (לא אחרי האחרונה, כדי שהכפתורים שלה יהיו פעילים מיד)
    for (const [i, m] of messages.entries()) { if (i) await new Promise((r) => setTimeout(r, 250)); render(m); }
  } catch {
    wait.remove();
    bubble('in', 'הייתה תקלה. נסו שוב בעוד רגע 🙏');
  } finally { busy = false; }
}

// בזמן שהבוט עונה לא שולחים עוד (אחרת ההודעה הייתה מוצגת ולא נשלחת): הלחיצה לא נקלטת והטקסט נשאר בשדה
function choose(id, title) { if (busy) return; lockOld(); bubble('out', esc(title)); send({ id }); }
document.getElementById('form').onsubmit = (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || busy) return;
  input.value = '';
  lockOld(); bubble('out', esc(t)); send({ text: t });
};
const info = document.getElementById('info');
const who = document.getElementById('who');
const closeInfo = () => { if (!info.classList.contains('open')) return; info.classList.remove('open'); who.focus(); };
who.onclick = () => { info.classList.add('open'); document.getElementById('infoClose').focus(); };
document.getElementById('infoClose').onclick = closeInfo;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeInfo(); if (sheetBg.classList.contains('open')) closeSheet(); } });
document.getElementById('menuBtn').onclick = () => choose('m:menu', 'תפריט ראשי');

send({}); // פתיחת שיחה: ברכה ותפריט
</script>
</body>
</html>

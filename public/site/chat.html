<style>
  :root { --green: #3a2e1c; --hdr-text: #f6e7c1; --bg: rgba(250,245,234,.55); --out: #f1e2b9; --in: #fffdf8; --text: #33291c; --muted: #6b5d47; --link: #7a5a1f; --line: rgba(176,141,74,.45); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); background: transparent; min-height: 0; color: var(--text); display: flex; justify-content: center; padding: 26px 14px; }
  :focus-visible { outline: 3px solid #6b4a12; outline-offset: 2px; }
  header :focus-visible { outline-color: #f6e7c1; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  .app { width: 100%; max-width: 640px; height: calc(100dvh - 52px); overflow: hidden; border-radius: 24px; display: flex; flex-direction: column; background: var(--bg); position: relative; box-shadow: 0 24px 70px rgba(70,48,12,.30); border: 1px solid rgba(255,255,255,.7); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  header { background: #2c2217; color: var(--hdr-text); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: none; border: 1.5px solid #b08d4a; }
  .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; color: inherit; font: inherit; text-align: start; cursor: pointer; padding: 0; }
  .title { flex: 1; min-width: 0; display: block; }
  .title b { display: block; font-family: var(--serif); font-size: 1.15rem; }
  .title .hint { font-style: normal; }
  .title span { display: block; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button:not(.who) { background: transparent; color: var(--hdr-text); border: 1px solid #b08d4a !important; border: 0; border-radius: 18px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 6px; background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 18px 18px; }
  .row { display: flex; flex-direction: column; max-width: 86%; }
  .row.in { align-self: flex-start; }
  .row.out { align-self: flex-end; }
  .bubble { background: var(--in); border-radius: 18px; padding: 10px 14px 8px; box-shadow: 0 1px 3px rgba(90,64,20,.14); white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.45; font-size: .98rem; }
  .row.out .bubble { background: var(--out); }
  .nb { white-space: nowrap; }
  .bubble a { color: var(--link); }
  .bubble .quote { display: block; border-inline-start: 3px solid #d9c08a; padding-inline-start: 8px; color: var(--muted); font-size: .9rem; }
  .time { font-size: .7rem; color: var(--muted); text-align: end; margin-top: 2px; display: block; }
  .btns { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .btns button { background: var(--in); color: var(--link); border: 1px solid rgba(176,141,74,.7); border-radius: 999px; padding: 11px 14px; font: inherit; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(90,64,20,.12); }
  .btns button:hover { background: #f6ecd2; }
  .btns button:disabled { color: var(--muted); cursor: default; }
  .typing .bubble { color: var(--muted); letter-spacing: 3px; }
  form { display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(250,245,234,.9); border-top: 1px solid rgba(176,141,74,.25); }
  input { flex: 1; min-width: 0; border: 1px solid rgba(176,141,74,.45); border-radius: 999px; height: 48px; padding: 0 18px; font: inherit; font-size: 1rem; background: var(--in); color: var(--text); outline: none; }
  form button { width: 48px; height: 48px; border: 0; border-radius: 50%; background: #b08d4a; color: #2c2217; font-size: 1.2rem; cursor: pointer; flex: none; }
  .info { position: absolute; inset: 0; background: #faf5ea; display: none; flex-direction: column; overflow-y: auto; z-index: 5; }
  .info.open { display: flex; }
  .info header { position: sticky; top: 0; }
  .info header button { background: none; border: 0 !important; font-size: 1.5rem; padding: 0 6px; }
  .card { background: #fffdf8; border-block: 1px solid var(--line); margin-bottom: 10px; padding: 14px 18px; }
  .card.top { text-align: center; padding: 24px 18px; }
  .card.top img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 2px solid #b08d4a; padding: 3px; background: #fffdf8; }
  .card.top h2 { margin: 12px 0 2px; font-family: var(--serif); font-size: 1.5rem; }
  .card.top p { margin: 0; color: var(--muted); }
  .card h4 { margin: 0 0 6px; font-size: .85rem; color: var(--muted); font-weight: 500; }
  .card p { margin: 0; line-height: 1.5; }
  .links a { display: flex; align-items: center; gap: 12px; padding: 12px 0; color: var(--text); text-decoration: none; border-top: 1px solid rgba(176,141,74,.25); }
  .links a:first-child { border-top: 0; }
  .links a span { font-size: 1.3rem; width: 28px; text-align: center; }
  .links a small { display: block; color: var(--muted); }
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  .sheet-bg.open { display: flex; }
  .sheet { background: #fffdf8; width: 100%; max-height: 75%; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
  .sheet h3 { margin: 0; padding: 16px; font-size: 1rem; border-bottom: 1px solid rgba(176,141,74,.4); font-family: var(--serif); display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
  .sheet ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  .sheet li { border-bottom: 1px solid rgba(176,141,74,.2); }
  .sheet li button { width: 100%; text-align: start; background: none; border: 0; padding: 14px 16px; font: inherit; color: var(--text); cursor: pointer; }
  .sheet li button:hover { background: #f6ecd2; }
  .sheet li small { display: block; color: var(--muted); }
  @media (max-width: 600px) { .title .hint { display: none; } body { padding: 10px 8px; } .app { height: calc(100dvh - 20px); border-radius: 20px; } }
</style>

<body>
<div class="app">
  <header>
    <button class="who" id="who" type="button" aria-label="פרטי העסק">
      <img class="avatar" src="/logo.png" alt="">
      <span class="title"><b>שמחה בשיחה</b><span>כל האולמות במספר אחד<em class="hint"> · לחצו לפרטים</em></span></span>
    </button>
    <button id="menuBtn" type="button">תפריט</button>
  </header>
  <div id="log" role="log" aria-live="polite" aria-label="שיחה" tabindex="0"></div>
  <form id="form" autocomplete="off">
    <input id="text" placeholder="כתבו הודעה" enterkeyhint="send" aria-label="הודעה">
    <button type="submit" aria-label="שליחה"><span aria-hidden="true">➤</span></button>
  </form>
  <div class="info" id="info" role="dialog" aria-modal="true" aria-label="פרטי העסק">
    <header><button id="infoClose" type="button" aria-label="חזרה">→</button><div class="title"><b>פרטי העסק</b></div></header>
    <div class="card top"><img src="/logo.png" alt="שמחה בשיחה"><h2>שמחה בשיחה</h2><p>כל האולמות במספר אחד</p></div>
    <div class="card"><h4>אודות</h4><p>מוצאים אולם לאירוע לפי כמות מוזמנים, עיר ושכונה, או לפי שם, ומתחברים ישירות לטלפון של האולם.</p></div>
    <div class="card links">
      <a href="tel:033130858"><span aria-hidden="true">📞</span><div>03-313-0858</div></a>
      <a href="https://wa.me/97233130858" target="_blank" rel="noopener"><span aria-hidden="true">💬</span><div>WhatsApp</div></a>
      <a href="mailto:info@simcha-besicha.co.il"><span aria-hidden="true">✉️</span><div>info@simcha-besicha.co.il</div></a>
      <a href="/" target="_blank" rel="noopener"><span aria-hidden="true">🌐</span><div>דף הבית</div></a>
      <a href="/privacy" target="_blank" rel="noopener"><span aria-hidden="true">🔒</span><div>מדיניות פרטיות</div></a>
      <a href="/accessibility" target="_blank" rel="noopener"><span aria-hidden="true">♿</span><div>הצהרת נגישות</div></a>
    </div>
  </div>
  <div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h3><span id="sheetTitle"></span><button id="sheetClose" type="button" aria-label="סגירה">×</button></h3><ul id="sheetRows"></ul></div></div>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('text');
const sheetBg = document.getElementById('sheetBg');
let busy = false;

// מזהה שיחה: נשמר בלשונית (רענון לא מאפס), ואם האחסון חסום - מזהה לרענון הנוכחי
function makeSid() {
  try { const s = sessionStorage.getItem('sid'); if (s) return s; } catch {}
  const s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/[^A-Za-z0-9_-]/g, '').padEnd(16, 'x');
  try { sessionStorage.setItem('sid', s); } catch {}
  return s;
}
const sid = makeSid();
// קישורי חיוג (tel:) עובדים רק בטלפון: השרת לא יציג אותם במחשב
const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// עיצוב וואטסאפ: *מודגש*, קישורים, מספר טלפון לחיץ, ושורה שמתחילה ב-"> " כציטוט
function fmt(text) {
  return text.split('\n').map((line) => {
    const quote = line.startsWith('> ');
    let h = esc(quote ? line.slice(2) : line);
    // קישורים עם https:// וגם בלי (הבוט מציג כתובות בלי https://): חייבים נקודה בדומיין ונתיב אחרי /
    h = h.replace(/(^|[\s\u200F(])((?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}\/[^\s<]*)/gi, (m, pre, url) =>
      `${pre}<a href="${/^https?:/i.test(url) ? url : 'https://' + url}" target="_blank" rel="noopener">${url}</a>`);
    h = h.replace(/(^|[\s(,:])(0\d{1,2}-\d{3}-\d{4})(?=[\s,.)]|$)/g, (m, p, n) => `${p}<a href="tel:${n.replace(/-/g, '')}">${n}</a>`);
    h = h.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    h = h.replace(/\u2066[^\u2069]*\u2069/g, '<span class="nb">$&</span>'); // מספר החיוג לא נשבר לשתי שורות
    return quote ? `<span class="quote">${h}</span>` : h;
  }).join('\n').replace(/<\/span>\n(?=<span class="quote">)/g, '</span>');
}
const hhmm = () => new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
const scroll = () => { log.scrollTop = log.scrollHeight; };

function bubble(kind, html) {
  const row = document.createElement('div');
  row.className = `row ${kind}`;
  row.innerHTML = `<div class="bubble" dir="auto">${html}<span class="time">${hhmm()}</span></div>`;
  log.appendChild(row);
  scroll();
  return row;
}

function openSheet(title, rows) {
  document.getElementById('sheetTitle').textContent = title;
  const ul = document.getElementById('sheetRows');
  ul.innerHTML = '';
  for (const [id, t, desc] of rows) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `${esc(t)}${desc ? `<small>${esc(desc)}</small>` : ''}`;
    b.onclick = () => { closeSheet(false); choose(id, t); };
    li.appendChild(b);
    ul.appendChild(li);
  }
  opener = document.activeElement;
  sheetBg.classList.add('open');
  ul.querySelector('button')?.focus();
}
// סגירת החלון: המיקוד חוזר למה שפתח אותו
let opener = null;
function closeSheet(restore = true) {
  sheetBg.classList.remove('open');
  if (restore && opener) opener.focus();
}
document.getElementById('sheetClose').onclick = () => closeSheet();
sheetBg.onclick = (e) => { if (e.target === sheetBg) closeSheet(); };

function render(m) {
  if (m.kind === 'text') return bubble('in', fmt(m.text));
  const row = bubble('in', fmt(m.body));
  const box = document.createElement('div');
  box.className = 'btns';
  if (m.kind === 'buttons') {
    for (const [id, title] of m.buttons) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = title;
      b.onclick = () => choose(id, title);
      box.appendChild(b);
    }
  } else {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = `☰ ${m.button}`;
    b.onclick = () => openSheet(m.button, m.rows);
    box.appendChild(b);
  }
  row.appendChild(box);
  scroll();
}

// כפתורים ישנים נחסמים אחרי לחיצה: כך לא לוחצים על שלב שכבר עבר (נשארת רק הרשימה האחרונה פעילה)
function lockOld() { for (const b of log.querySelectorAll('.btns button')) b.disabled = true; }

async function send(payload) {
  if (busy) return;
  busy = true;
  const wait = bubble('in typing', '•••');
  wait.classList.add('typing');
  try {
    const res = await fetch('/api/webchat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sid, desktop: !mobile, ...payload }) });
    if (!res.ok) throw new Error(res.status);
    const { messages } = await res.json();
    wait.remove();
    for (const m of messages) { render(m); await new Promise((r) => setTimeout(r, 250)); }
  } catch {
    wait.remove();
    bubble('in', 'הייתה תקלה. נסו שוב בעוד רגע 🙏');
  } finally { busy = false; }
}

function choose(id, title) { lockOld(); bubble('out', esc(title)); send({ id }); }
document.getElementById('form').onsubmit = (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  lockOld(); bubble('out', esc(t)); send({ text: t });
};
const info = document.getElementById('info');
const who = document.getElementById('who');
const closeInfo = () => { if (!info.classList.contains('open')) return; info.classList.remove('open'); who.focus(); };
who.onclick = () => { info.classList.add('open'); document.getElementById('infoClose').focus(); };
document.getElementById('infoClose').onclick = closeInfo;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeInfo(); if (sheetBg.classList.contains('open')) closeSheet(); } });
document.getElementById('menuBtn').onclick = () => choose('m:menu', 'תפריט ראשי');

send({}); // פתיחת שיחה: ברכה ותפריט
</script>
</body>
